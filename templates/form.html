<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction</title>
</head>
<body>
    <form action="{{url_for('prediction')}}" method="POST">
        <textarea type="text" name="email" placeholder="email message">
            </textarea>
            <button>Predict</button>
    </form>
    <div>
        {% if message %}
            <p>{{message}}</p>
        {% endif %}
    </div>
</body>
</html>
